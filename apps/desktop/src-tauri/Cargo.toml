[package]
name = "silicium-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Silicium desktop shell: hosts the web UI and holds the machine signing key."

# Own workspace: excluded from the node workspace (Cargo.toml at the repository root).
[workspace]

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sil-crypto = { path = "../../../crates/sil-crypto" }
sil-types = { path = "../../../crates/sil-types" }

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
