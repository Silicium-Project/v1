[package]
name = "silicium-desktop"
version = "1.8.0"
edition = "2024"
license = "MIT"
publish = false
description = "Silicium desktop shell: hosts the web UI and holds the machine signing key."

# Own workspace: excluded from the node workspace (Cargo.toml at the repository root).
[workspace]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sil-crypto = { path = "../../../crates/sil-crypto" }
sil-types = { path = "../../../crates/sil-types" }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
ed25519-dalek = "2"
getrandom = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
