[package]
name = "sil-raytracer"
description = "Moteur de rendu raytracing déterministe, porté de silicium-raytracer v0 : scène .cfg vers pixels RGB24, ligne par ligne, sans dépendance système."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sil-raytracer-block"
