# Release : dev = site et téléchargements de développement ; main = production (environnement protégé).
# Les dépôts composants sont privés : le checkout récursif utilise COMPONENTS_READ_TOKEN (lecture seule).
name: release
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Bloquant : rien n'est construit, signé ni déployé si une suite échoue. Les tests tournent sur les
  # SHA épinglés dans ce dépôt (mêmes commandes que les CI des composants).
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.COMPONENTS_READ_TOKEN }}
      - name: Accès aux dépendances privées (cargo)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            network
            chain/node
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Réseau - moteurs wasm des tests, format, clippy, tests
        working-directory: network
        run: |
          cargo build -p sil-raytracer --bin sil-raytracer-block --target wasm32-wasip1 --release
          cargo build -p sil-wl-render --bin sil-render-reference --target wasm32-wasip1
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: API - vet, format, tests
        working-directory: services/api
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: Site - typecheck et tests
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Chaîne - vérification de chaque crate
        working-directory: chain
        run: |
          for c in adapter devnet-job e2e node program; do
            cargo check --manifest-path "$c/Cargo.toml"
          done

  linux-binaries:
    needs: [tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.COMPONENTS_READ_TOKEN }}
      - name: Accès aux dépendances privées (cargo)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            network
            chain/node
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: Nœud (chain/node)
        run: |
          cd chain/node && cargo build --release
          mkdir -p ../../dist/linux-amd64
          cp target/release/silicium-node ../../dist/linux-amd64/
      - name: Raytracer et lanceur d'isolation (network)
        run: |
          cd network
          cargo build --release -p sil-raytracer --bin sil-raytracer-block
          cargo build --release -p sil-sandbox --bin sil-sandbox-launch
          cp target/release/sil-raytracer-block target/release/sil-sandbox-launch ../dist/linux-amd64/
      - name: ONNX Runtime
        run: python3 tools/runtime/fetch_onnxruntime.py linux dist/linux-amd64
      - name: API (Go)
        working-directory: services/api
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../dist/linux-amd64/silicium-api ./cmd/silicium-api
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-amd64
          path: dist/linux-amd64/
          retention-days: 7

  windows-binaries:
    needs: [tests]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.COMPONENTS_READ_TOKEN }}
      - name: Accès aux dépendances privées (cargo)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            network
            chain/node
      - name: Nœud Windows (chain/node)
        shell: pwsh
        run: |
          cd chain/node; cargo build --release
          New-Item -ItemType Directory -Force ../../dist/windows-amd64 | Out-Null
          Copy-Item target/release/silicium-node.exe ../../dist/windows-amd64/
      - name: Moteur de rendu wasm (network)
        shell: pwsh
        run: |
          cd network
          cargo build --release -p sil-raytracer --bin sil-raytracer-block --target wasm32-wasip1
          Copy-Item target/wasm32-wasip1/release/sil-raytracer-block.wasm ../dist/windows-amd64/
      - name: ONNX Runtime
        shell: pwsh
        run: python tools/runtime/fetch_onnxruntime.py windows dist/windows-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-amd64
          path: dist/windows-amd64/
          retention-days: 7

  linux-packages:
    needs: [linux-binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.COMPONENTS_READ_TOKEN }}
      - name: Accès aux dépendances privées (cargo)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-amd64
          path: dist/linux-amd64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dépendances de paquetage
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm rsync
          chmod +x dist/linux-amd64/silicium-node dist/linux-amd64/silicium-api dist/linux-amd64/sil-raytracer-block dist/linux-amd64/sil-sandbox-launch
      - name: AppImage, deb, rpm
        run: bash infra/release/build-linux-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: |
            apps/web/public/downloads/*.AppImage
            apps/web/public/downloads/*.deb
            apps/web/public/downloads/*.rpm
          retention-days: 30

  windows-installer:
    needs: [windows-binaries]
    runs-on: windows-2022
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.COMPONENTS_READ_TOKEN }}
      - name: Accès aux dépendances privées (cargo)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows-amd64
          path: dist/windows-amd64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Certificat de signature (production et dev, même méthode)
        shell: pwsh
        env:
          SIGN_PFX_B64: ${{ secrets.SIGN_PFX_B64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_B64))
          $pw = ConvertTo-SecureString $env:SIGN_PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw | Out-Null
          Remove-Item $pfx -Force
          # Certificat public seulement (aucune clé privée) : sert au téléchargement de l'installeur.
          New-Item -ItemType Directory -Force apps/web/public/downloads | Out-Null
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq 'A58274656DA5B0B0731139D8D0E46D26ECF1B4D4' }
          Export-Certificate -Cert $cert -FilePath apps/web/public/downloads/silicium-school-certificate.cer | Out-Null
          $tool =Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($tool.FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: Installeur NSIS
        shell: pwsh
        run: |
          cd apps/web; npm ci
          cd ../desktop; npm ci; npm run build
      - name: Paquets Windows du site
        shell: pwsh
        run: |
          cd apps/web
          node scripts/copy-node-bundle.mjs
          node scripts/copy-app-installer.mjs public/downloads/silicium-school-certificate.cer
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: apps/web/public/downloads/*.exe
          retention-days: 30

  site:
    needs: [linux-packages, windows-installer]
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.COMPONENTS_READ_TOKEN }}
      - name: Accès aux dépendances privées (cargo)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux
          path: apps/web/public/downloads
      - uses: actions/download-artifact@v4
        with:
          name: packages-windows
          path: apps/web/public/downloads
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-amd64
          path: dist/linux-amd64
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows-amd64
          path: dist/windows-amd64
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Site
        working-directory: apps/web
        run: |
          npm ci
          node scripts/copy-node-bundle.mjs
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/web/dist/
          retention-days: 30

  # Dépôts DNF et APT : reprend le dépôt existant sur le VPS, ajoute les nouveaux paquets, signe les
  # métadonnées avec la clé de release (secret de l'environnement), puis publie. Dev et prod séparés.
  repos:
    needs: [linux-packages]
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux
          path: packages
      - name: Outils de dépôts
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c apt-utils rsync
      - name: Clé de release
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "2CD1065DAD1608515C16B8C6A020E885482D953A:6:" | gpg --batch --import-ownertrust
      - name: Clé SSH et hôte
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SIL_SSH_KEY=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"
          echo "SIL_SSH_KNOWN_HOSTS=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Publication des dépôts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SIL_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          RELEASE_KEY_FPR: 2CD1065DAD1608515C16B8C6A020E885482D953A
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: bash infra/release/publish-repos.sh "$DEPLOY_HOST" packages
      - name: Vérification publique
        env:
          SIL_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        run: |
          base=https://siliciumlabs.org
          [ "$SIL_ENV" = dev ] && base=https://vps-910c1dbc.vps.ovh.net
          curl -fsS "$base/download/dnf/repodata/repomd.xml.asc" > /dev/null
          curl -fsS "$base/download/apt/dists/stable/InRelease" > /dev/null
          echo REPOS_OK

  deploy:
    needs: [site, linux-binaries]
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.COMPONENTS_READ_TOKEN }}
      - name: Accès aux dépendances privées (cargo)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-amd64
          path: dist/linux-amd64
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: apps/web/dist
      - name: Clé SSH et hôte
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SIL_SSH_KEY=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"
          echo "SIL_SSH_KNOWN_HOSTS=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Binaires (copie, sans sauvegarde)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SIL_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        run: bash infra/vps/deploy.sh "$DEPLOY_HOST"
      - name: Site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SIL_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        run: |
          site=/opt/silicium-dev/web; [ "$SIL_ENV" = prod ] && site=/opt/silicium/web
          tar -C apps/web/dist -cf - . | ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$DEPLOY_HOST" "sudo tar -C $site -xf -"
