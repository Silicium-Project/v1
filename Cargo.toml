# Workspace Rust de V1. Un crate = une responsabilitÃ© (voir docs/technical/architecture.md).
[workspace]
resolver = "3"
members = ["crates/*"]
# The desktop shell needs WebView2 / WebKitGTK and its own lock file: built apart (see apps/desktop/README.md).
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
sil-types = { path = "crates/sil-types" }
sil-crypto = { path = "crates/sil-crypto" }
sil-codec = { path = "crates/sil-codec" }
sil-config = { path = "crates/sil-config" }
sil-telemetry = { path = "crates/sil-telemetry" }
sil-attest = { path = "crates/sil-attest" }
sil-quota = { path = "crates/sil-quota" }
sil-ledger = { path = "crates/sil-ledger" }
sil-ledger-store = { path = "crates/sil-ledger-store" }
sil-content = { path = "crates/sil-content" }
sil-models = { path = "crates/sil-models" }
sil-net = { path = "crates/sil-net" }
sil-transfer = { path = "crates/sil-transfer" }
sil-sampling = { path = "crates/sil-sampling" }
sil-wl-embed = { path = "crates/sil-wl-embed" }
sil-workload-api = { path = "crates/sil-workload-api" }
sil-wl-sha256 = { path = "crates/sil-wl-sha256" }
sil-wl-render = { path = "crates/sil-wl-render" }
sil-batch = { path = "crates/sil-batch" }
sil-wl-image = { path = "crates/sil-wl-image" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sil-sandbox = { path = "crates/sil-sandbox" }
sil-render-wasm = { path = "crates/sil-render-wasm" }
sil-reputation = { path = "crates/sil-reputation" }
sil-bayes = { path = "crates/sil-bayes" }
sil-chain-core = { path = "crates/sil-chain-core" }
sil-raytracer = { path = "crates/sil-raytracer" }
sil-workload-spec = { path = "crates/sil-workload-spec" }
sil-model = { path = "crates/sil-model" }
sil-settlement = { path = "crates/sil-settlement" }
sil-control-api = { path = "crates/sil-control-api" }
sil-node = { path = "crates/sil-node" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ort = { version = "=2.0.0-rc.2", default-features = false, features = ["load-dynamic", "ndarray"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ciborium = "0.2"
ed25519-dalek = "2"
sha2 = "0.10"
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
getrandom = "0.2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tempfile = "3"
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "quic", "noise", "yamux", "gossipsub", "kad", "identify", "request-response", "cbor", "macros", "relay", "dcutr"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
futures = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
serde_json = "1"
sysinfo = "0.32"
ureq = { version = "2", features = ["json"] }
tower = { version = "0.5", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
